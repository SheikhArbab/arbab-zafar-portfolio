[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Content-Security-Policy is generated per build into dist/_headers (scripts/prerender.ts)

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Real files (prerendered pages, assets) are always served first. Rules below only apply to
# paths with no file behind them.

# A missing hashed asset must be a real 404, never HTML (a stale tab then reloads cleanly).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# App routes rendered in the browser: the admin, and projects added after the last build.
[[redirects]]
  from = "/admin"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/projects/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/de/projects/*"
  to = "/spa.html"
  status = 200

# Anything else is a genuine 404 (the React app renders the not-found page).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
